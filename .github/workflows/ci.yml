name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://medschedule-ai-api.vercel.app/api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend · install & import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile all modules
        run: python -m compileall -q app
      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title)"
      - name: End-to-end smoke test (offline, no DB / no API key)
        run: python tests/smoke_full_pipeline.py
      - name: Client requirement tests (multi-class upload, integration, copilot, report)
        run: python tests/test_client_requirements.py
      - name: Upload-form field tests (session, module override, detected class)
        run: python tests/test_upload_fields.py
