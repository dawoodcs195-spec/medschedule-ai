services:
  - type: web
    name: medschedule-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://medschedule-ai.vercel.app,http://localhost:3000
